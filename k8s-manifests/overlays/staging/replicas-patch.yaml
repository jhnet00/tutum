# staging 리소스 제한 패치 (KEDA 관리 대상인 backend/frontend는 replicas 제거)
# EKS staging: cloudflared 불필요 (ALB 사용), replica=0으로 비활성화
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: tutum-app
spec:
  replicas: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tutum-app
spec:
  template:
    spec:
      containers:
        - name: frontend
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tutum-app
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          args:
            - |
              python <<'PY'
              from pathlib import Path

              path = Path("/app/app/routers/admin.py")
              try:
                  source = path.read_text(encoding="utf-8")
              except FileNotFoundError:
                  raise SystemExit(0)

              replacements = {
                  '_HTTP_MIMIR = httpx.AsyncClient(timeout=5.0)': '_HTTP_MIMIR = httpx.AsyncClient(timeout=5.0, headers={"X-Scope-OrgID": "tutum"})',
                  '_HTTP_LOKI = httpx.AsyncClient(timeout=8.0)': '_HTTP_LOKI = httpx.AsyncClient(timeout=8.0, headers={"X-Scope-OrgID": "tutum"})',
              }

              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  print("[BackendPatch] admin.py monitoring headers injected")
              else:
                  print("[BackendPatch] admin.py already patched")
              PY
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
# vCPU quota(32) 대응: staging Kafka/ES 리소스 최소화
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: tutum-data
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: tutum-data
spec:
  template:
    spec:
      containers:
        - name: elasticsearch
          resources:
            requests:
              cpu: 200m
              memory: 2750Mi
            limits:
              cpu: 2
              memory: 3Gi
