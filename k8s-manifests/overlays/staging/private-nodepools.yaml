apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: private-general
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 30s
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: 32
    memory: 64Gi
  template:
    metadata: {}
    spec:
      expireAfter: 336h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: private-only
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot        # 우선 시도 (on-demand 대비 ~70% 절감)
            - on-demand   # spot 가용 인스턴스 없을 때 fallback
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "4"
        - key: eks.amazonaws.com/instance-size
          operator: In
          values:
            - small
            - medium
            - large       # xl/2xl/4xl 이상 차단 (비용 runaway 방지)
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: private-system
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 30s
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: 16
    memory: 32Gi
  template:
    metadata: {}
    spec:
      expireAfter: 336h
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: private-only
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "4"
        - key: eks.amazonaws.com/instance-size
          operator: In
          values:
            - small
            - medium
            - large
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
      taints:
        - key: CriticalAddonsOnly
          effect: NoSchedule
