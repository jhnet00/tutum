# EKS Auto Mode용 nodeSelector 제거 패치
# on-prem 노드 레이블(workload=app/data/consumer)이 EKS에 없으므로 제거
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-producer
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
