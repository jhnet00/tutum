  name: price-consumer
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-producer
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-consumer
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-consumer
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  namespace: tutum-app
spec:
  template:
    spec:
      nodeSelector: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: tutum-data
spec:
  template:
    spec:
      nodeSelector: {}
