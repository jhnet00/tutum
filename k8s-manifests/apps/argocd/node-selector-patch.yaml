# ArgoCD 컴포넌트 private-only nodeSelector 패치
# ServerSideApply로 적용 — 이 파일에서 명시한 필드만 관리됨
# 목적: default nodeclass 노드에서 NAT 없는 노드로 이미지 pull 실패 방지
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
  namespace: argocd
spec:
  template:
    spec:
      nodeSelector:
        eks.amazonaws.com/nodeclass: private-only
