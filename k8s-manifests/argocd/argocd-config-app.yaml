# ArgoCD self-management Application
# ArgoCD 컴포넌트를 private-only 노드로 고정하고 repo-server 타임아웃 설정
# ServerSideApply=true: partial spec으로 지정된 필드만 관리 (나머지 필드 간섭 없음)
# 실행: kubectl apply -f k8s-manifests/argocd/argocd-config-app.yaml -n argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.com/tutum-project/tutum-app/tutum-backend.git
    targetRevision: develop
    path: k8s-manifests/apps/argocd
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
