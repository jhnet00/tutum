apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: tutum-data
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: tutum
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: tutum-data
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: tutum
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      nodeSelector:
        workload: app
      # repository-s3 플러그인 설치 (elasticsearch-backup CronJob의 S3 스냅샷 저장소 등록에 필요)
      # 공식 이미지(8.17.0)에 미포함 → initContainer로 플러그인 설치 후 플러그인 디렉토리를 emptyDir 공유
      initContainers:
        - name: install-s3-plugin
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          command:
            - sh
            - -c
            - |
              set -e
              echo "[init] repository-s3 플러그인 설치 시작"
              elasticsearch-plugin install --batch repository-s3
              echo "[init] 플러그인 설치 완료"
          volumeMounts:
            - name: es-plugins
              mountPath: /usr/share/elasticsearch/plugins
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: es-plugins
          emptyDir: {}
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
            - name: es-plugins
              mountPath: /usr/share/elasticsearch/plugins
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
