# MinIO 4-pod Distributed Mode (Erasure Coding)
# - 4 pods × 20Gi = 80Gi raw / ~40Gi usable (EC 2+2)
# - Survives 1-node failure
# - Pod anti-affinity: spread across worker nodes (soft)
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tutum-storage
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tutum
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
---
# Headless service for pod-to-pod discovery in distributed mode
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: tutum-storage
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tutum
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: tutum-storage
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tutum
spec:
  serviceName: minio-headless
  replicas: 4
  selector:
    matchLabels:
      app: minio
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: minio
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: minio
                topologyKey: kubernetes.io/hostname
      containers:
        - name: minio
          image: 903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/minio/minio:RELEASE.2024-01-16T16-07-38Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - http://minio-{0...3}.minio-headless.tutum-storage.svc.cluster.local/data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
