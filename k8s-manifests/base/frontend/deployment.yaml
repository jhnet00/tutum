apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tutum-app
  labels:
    app: frontend
    version: v1
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      nodeSelector:
        workload: app
      containers:
        - name: frontend
          image: 903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/tutum/frontend:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            # Frontend server routes proxy both auth and backend APIs, so they must
            # target the in-cluster ingress gateway instead of a single backend service.
            - name: BACKEND_INTERNAL_URL
              value: "http://istio-ingressgateway.istio-system.svc.cluster.local"
            - name: API_BASE_URL
              value: "http://istio-ingressgateway.istio-system.svc.cluster.local"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/proxy"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      imagePullSecrets:
        - name: gitlab-registry-secret
