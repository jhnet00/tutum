apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tutum-app
  labels:
    app: frontend
    version: v1
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: 903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/tutum/frontend:latest
          command:
            - /bin/sh
            - -lc
          args:
            - |
              set -eu
              node <<'NODE'
              const fs = require("fs");
              const path = "/app/.next/server/app/api/proxy/[...path]/route.js";
              const source = fs.readFileSync(path, "utf8");
              const target = 'let r;let o=process.env.BACKEND_INTERNAL_URL||"http://localhost:8000";if(!o)return console.error("[Proxy] ERROR: API base URL is not configured"),new Response(JSON.stringify({detail:"API base URL is not configured"}),{status:500,headers:{"Content-Type":"application/json"}});if("import"===t[0]){let e=process.env.OCR_SERVICE_URL||"http://ocr.tutum-app.svc.cluster.local:8002";r=new URL(`${e.replace(/\\/$/,"")}/${t.join("/")}`)}else r=new URL(`${o.replace(/\\/$/,"")}/${t.join("/")}`);';
              const replacement = 'let r;let o=process.env.BACKEND_INTERNAL_URL||"http://backend-svc.tutum-app.svc.cluster.local:8000",n=process.env.AUTH_INTERNAL_URL||"http://auth-svc.tutum-app.svc.cluster.local:8001";if(!o)return console.error("[Proxy] ERROR: API base URL is not configured"),new Response(JSON.stringify({detail:"API base URL is not configured"}),{status:500,headers:{"Content-Type":"application/json"}});if("import"===t[0]){let e=process.env.OCR_SERVICE_URL||"http://ocr.tutum-app.svc.cluster.local:8002";r=new URL(`${e.replace(/\\/$/,"")}/${t.join("/")}`)}else{let e="api"===t[0]&&"v1"===t[1]&&"auth"===t[2]?n:o;r=new URL(`${e.replace(/\\/$/,"")}/${t.join("/")}`)}';
              if (!source.includes(target)) {
                throw new Error("frontend proxy patch target not found");
              }
              fs.writeFileSync(path, source.replace(target, replacement));
              NODE
              exec node server.js
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://backend-svc.tutum-app.svc.cluster.local:8000"
            - name: AUTH_INTERNAL_URL
              value: "http://auth-svc.tutum-app.svc.cluster.local:8000"
            - name: API_BASE_URL
              value: "http://backend-svc.tutum-app.svc.cluster.local:8000"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/proxy"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      imagePullSecrets:
        - name: gitlab-registry-secret
