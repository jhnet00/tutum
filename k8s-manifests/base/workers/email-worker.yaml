apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker
  namespace: tutum-app
  labels:
    app: email-worker
    app.kubernetes.io/name: email-worker
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-worker
  template:
    metadata:
      labels:
        app: email-worker
    spec:
      containers:
        - name: email-worker
          image: registry.gitlab.com/tutum-project/tutum-app/backend/workers:latest
          command: ["python", "-u", "email_worker.py"]
          env:
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: SQS_QUEUE_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SQS_QUEUE_NAME
            - name: SQS_DLQ_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SQS_DLQ_NAME
            - name: SES_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SES_SENDER_EMAIL
            - name: SES_SENDER_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SES_SENDER_NAME
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: FRONTEND_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      imagePullSecrets:
        - name: gitlab-registry-secret
