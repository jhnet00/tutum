apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-consumer
  namespace: tutum-app
  labels:
    app: elastic-consumer
    app.kubernetes.io/name: elastic-consumer
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 0
  selector:
    matchLabels:
      app: elastic-consumer
  template:
    metadata:
      labels:
        app: elastic-consumer
    spec:
      nodeSelector:
        workload: app
      imagePullSecrets:
        - name: gitlab-registry-secret
        - name: gitlab-registry-secret
      containers:
        - name: elastic-consumer
          image: registry.gitlab.com/tutum-project/tutum-app/backend/workers:latest
          imagePullPolicy: Always
          command: ["python", "-u", "elastic_consumer.py"]
          envFrom:
            - configMapRef:
                name: news-pipeline-config
            - secretRef:
                name: news-pipeline-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
