apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-producer
  namespace: tutum-app
  labels:
    app: news-producer
    app.kubernetes.io/name: news-producer
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 0
  selector:
    matchLabels:
      app: news-producer
  template:
    metadata:
      labels:
        app: news-producer
    spec:
      nodeSelector:
        workload: app
      imagePullSecrets:
        - name: harbor-secret
        - name: gitlab-registry-secret
      containers:
        - name: news-producer
          image: registry.gitlab.com/tutum-project/tutum-app/backend/workers:latest
          imagePullPolicy: Always
          command: ["python", "-u", "producer_news.py"]
          envFrom:
            - configMapRef:
                name: news-pipeline-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
