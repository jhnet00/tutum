---
# ExternalSecrets Operator - SecretStore (AWS Secrets Manager)
# Phase B-13: KMS CMK + Secrets Manager + ESO 완료
# ESO Helm 설치: external-secrets/external-secrets v2.1.0
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace \
#     --set installCRDs=true \
#     --set image.repository=903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/external-secrets/external-secrets \
#     --set webhook.image.repository=903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/external-secrets/external-secrets-webhook \
#     --set certController.image.repository=903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/external-secrets/external-secrets-cert-controller \
#     --set image.tag=v2.1.0 --set webhook.image.tag=v2.1.0 --set certController.image.tag=v2.1.0
# IRSA: tutum-eso-role (external-secrets SA) + tutum-backend-secrets-role (backend-sa)
# KMS CMK: arn:aws:kms:ap-northeast-2:903913341620:key/4994cb9a-8eef-45eb-a84b-1a248c64af24
# STS VPC Endpoint: vpce-0d73b7f2b20079d68 (private DNS 활성화)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: tutum-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # auth 미지정 = ESO operator pod의 IRSA 사용 (external-secrets SA → tutum-eso-role)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: tutum-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tutum/backend-secret
