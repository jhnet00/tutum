apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: tutum-app-route
  namespace: tutum-app
spec:
  hosts:
    - "tutum.my"
    - "www.tutum.my"
  gateways:
    - tutum-gateway
  http:
    # WebSocket: /api/v1/market/ws
    - match:
        - uri:
            prefix: /api/v1/market/ws
      route:
        - destination:
            host: backend.tutum-app.svc.cluster.local
            port:
              number: 8000
      websocketUpgrade: true
    # Backend API: /api/*
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: backend.tutum-app.svc.cluster.local
            port:
              number: 8000
    # Frontend: /*
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend.tutum-app.svc.cluster.local
            port:
              number: 3000
