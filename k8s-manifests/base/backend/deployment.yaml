apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tutum-app
  labels:
    app: backend
    version: v1
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: registry.gitlab.com/tutum-project/tutum-app/backend:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGODB_URL
            - name: REDIS_URL
              value: "redis://redis.tutum-data.svc.cluster.local:6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.tutum-data.svc.cluster.local:9092"
            - name: MARIADB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_HOST
            - name: MARIADB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_PORT
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_PASSWORD
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_DATABASE
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            # AWS (SQS enqueue + SES sender)
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: SQS_QUEUE_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SQS_QUEUE_NAME
            - name: SQS_DLQ_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SQS_DLQ_NAME
            - name: SES_SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SES_SENDER_EMAIL
            - name: SES_SENDER_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SES_SENDER_NAME
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: FRONTEND_URL
            # MinIO
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_SECRET_KEY
            # KIS
            - name: KIS_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: KIS_APP_KEY
            - name: KIS_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: KIS_APP_SECRET
            - name: KIS_MODE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: KIS_MODE
            # Upbit
            - name: UPBIT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: UPBIT_ACCESS_KEY
            - name: UPBIT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: UPBIT_SECRET_KEY
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: GOOGLE_CLIENT_SECRET
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      imagePullSecrets:
        - name: gitlab-registry-secret
