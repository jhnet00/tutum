apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tutum-app
  labels:
    app: backend
    version: v1
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: tutum
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: backend-sa
      nodeSelector:
        workload: app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: 903913341620.dkr.ecr.ap-northeast-2.amazonaws.com/tutum/backend:latest
          command:
            - /bin/sh
            - -lc
          args:
            - |
              python <<'PY'
              from pathlib import Path

              path = Path("/app/app/routers/admin.py")
              try:
                  source = path.read_text(encoding="utf-8")
              except FileNotFoundError:
                  raise SystemExit(0)

              replacements = {
                  '_HTTP_MIMIR = httpx.AsyncClient(timeout=5.0)': '_HTTP_MIMIR = httpx.AsyncClient(timeout=5.0, headers={"X-Scope-OrgID": "tutum"})',
                  '_HTTP_LOKI = httpx.AsyncClient(timeout=8.0)': '_HTTP_LOKI = httpx.AsyncClient(timeout=8.0, headers={"X-Scope-OrgID": "tutum"})',
              }

              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != source:
                  path.write_text(updated, encoding="utf-8")
                  print("[BackendPatch] admin.py monitoring headers injected")
              else:
                  print("[BackendPatch] admin.py already patched")
              PY
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - secretRef:
                name: backend-secret
          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MONGODB_URL
            - name: REDIS_URL
              value: "redis://redis.tutum-data.svc.cluster.local:6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.tutum-data.svc.cluster.local:9092"
            - name: MARIADB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_HOST
            - name: MARIADB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_PORT
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_PASSWORD
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MARIADB_DATABASE
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
          resources:
            requests:
              cpu: 600m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      imagePullSecrets:
        - name: gitlab-registry-secret
