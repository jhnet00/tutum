name: commit-policy-guard

on:
  push:
  pull_request:

jobs:
  forbid-secrets-in-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check forbidden files in patch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
            if git cat-file -e "$BASE_SHA"^{commit} 2>/dev/null; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed_files.txt
            else
              git ls-tree -r --name-only HEAD > /tmp/changed_files.txt
            fi
          else
            if [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}"^{commit} 2>/dev/null; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed_files.txt
            else
              git ls-tree -r --name-only HEAD > /tmp/changed_files.txt
            fi
          fi

          bad=0
          while IFS= read -r f; do
            if [ -z "$f" ]; then
              continue
            fi

            if [ "$f" = ".env.example" ]; then
              continue
            fi

            if git check-ignore -q -- "$f"; then
              echo "Forbidden file detected (matched .gitignore): $f"
              bad=1
            fi
          done < /tmp/changed_files.txt

          if [ "$bad" -ne 0 ]; then
            echo "Forbidden files detected. Remove ignored files before push."
            exit 1
          fi
